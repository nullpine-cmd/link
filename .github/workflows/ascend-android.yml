name: Ascend Android

on:
  push:
    paths:
      - "ascend/**"
      - ".github/workflows/ascend-android.yml"
  pull_request:
    paths:
      - "ascend/**"
      - ".github/workflows/ascend-android.yml"
  workflow_dispatch:

concurrency:
  group: ascend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Тесты и сборка APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ascend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Юнит-тесты игровой логики
        run: ./gradlew :core:test :app:testDebugUnitTest --stacktrace

      - name: Сборка release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Переименовать APK
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Ascend.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Ascend-apk
          path: ascend/app/build/outputs/apk/release/Ascend.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: |
            ascend/app/build/reports/
            ascend/core/build/reports/
          if-no-files-found: ignore

  ui-test:
    name: Сквозной UI-тест на эмуляторе
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Включить KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Собрать тестовые APK
        working-directory: ascend
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Прогнать сценарий на Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          working-directory: ascend
          script: |
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true || touch ui-test-failed
            mkdir -p screenshots
            adb pull /sdcard/Android/data/com.ascend.app/files/screenshots/. screenshots/ || true
            adb exec-out run-as com.ascend.app tar -cf - files/screenshots > screenshots-internal.tar || true
            adb logcat -d > logcat.txt || true
            test ! -f ui-test-failed

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Ascend-screenshots
          path: |
            ascend/screenshots/
            ascend/screenshots-internal.tar
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-test-reports
          path: |
            ascend/logcat.txt
            ascend/app/build/reports/androidTests/
            ascend/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
